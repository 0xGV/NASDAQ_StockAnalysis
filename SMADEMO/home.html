{{ define "home"}}
<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Stock Market Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oxygen">
    <link rel="stylesheet" href="/css/colors.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/info.css">
</head>

<body class="bg-main" onload="indexMain()">
    <div id="navbar-parent"></div>
    <!-- title -->
    <div class="circle bg-circle">
        <!-- title and search bar -->
        <div class="circle-container vertical-center">
            <h1 class="display-1"> 
                Stock Market Analyzer
                <hr>
                <h4 class="text-muted"> Welcome! </h4>
            </h1>
            <br>
            <input class="search-bar-2 me-2" id="sbar" placeholder="Search for a symbol!" >
            <button type="submit" class="btn btn-outline-sma" id="sbutton" onClick="mainSearch()">Search</button>
        </div>
    </div>
    <!-- title -->

    <!-- scripts -->
    <script src="js/navbar.js"></script>
    <script src="js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
</body>

</html>

{{ end }}
